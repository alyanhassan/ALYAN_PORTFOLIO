<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap');
      .serif-editorial { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans-swiss { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .mono-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background #F7F7F4 -->
  <rect x="0" y="0" width="1600" height="1000" fill="#F7F7F4"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1600" height="80" fill="#F7F7F4"/>
  <line x1="0" y1="80" x2="1600" y2="80" stroke="#D9D5CE" stroke-width="1"/>

  <!-- Brand Left -->
  <text x="80" y="42" fill="#202020" class="serif-editorial" font-size="24" font-weight="400" letter-spacing="1.5">ATLAS ARCHITECTS</text>
  <text x="80" y="60" fill="#777777" class="mono-code" font-size="8.5" letter-spacing="1.8">EST. 2008  /  COPENHAGEN  •  ZURICH  •  TOKYO</text>

  <!-- Nav Links Center -->
  <g class="mono-code" font-size="11.5" fill="#777777" letter-spacing="0.8">
    <text x="420" y="46" fill="#202020">Archive</text>
    <text x="520" y="46">Studio</text>
    <text x="615" y="46">Team</text>
    <text x="700" y="46">Journal</text>
    <text x="795" y="46">Awards</text>
    <text x="895" y="46">Careers</text>
    <text x="1000" y="46">Contact</text>
    <text x="1080" y="42" font-size="8.5" fill="#A89A86">19:47</text>
    <text x="1080" y="52" font-size="8.5" fill="#A89A86">UTC</text>
  </g>

  <!-- Nav Actions Right -->
  <!-- CAD GRID [OFF] -->
  <rect x="1145" y="24" width="115" height="32" fill="none" stroke="#D9D5CE" stroke-width="1"/>
  <text x="1160" y="37" fill="#777777" class="mono-code" font-size="8.5" letter-spacing="1">CAD GRID</text>
  <text x="1160" y="48" fill="#777777" class="mono-code" font-size="8.5" letter-spacing="1">[OFF]</text>

  <!-- Search Icon Button -->
  <rect x="1310" y="24" width="40" height="32" fill="none" stroke="#D9D5CE" stroke-width="1"/>
  <circle cx="1328" cy="38" r="5" fill="none" stroke="#202020" stroke-width="1.4"/>
  <line x1="1332" y1="42" x2="1337" y2="47" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Inquire Button -->
  <rect x="1372" y="24" width="128" height="32" fill="#202020"/>
  <text x="1420" y="44.5" text-anchor="middle" fill="#F7F7F4" class="sans-swiss" font-size="10.5" font-weight="600" letter-spacing="1.5">INQUIRE ↗</text>

  <!-- HERO TYPOGRAPHY -->
  <!-- Line 1: DESIGNING -->
  <text x="80" y="240" fill="#202020" class="serif-editorial" font-size="172" font-weight="300" letter-spacing="-4">DESIGNING</text>

  <!-- Line 2: Left description paragraph + Right SPACES -->
  <g class="sans-swiss" font-size="13.5" font-weight="400" fill="#454545" letter-spacing="1.2">
    <text x="84" y="340">THE PHILOSOPHY OF PERMANENCE IN A</text>
    <text x="84" y="365">TRANSIENT WORLD. WE CONSTRUCT</text>
    <text x="84" y="390">ENVIRONMENTS THAT PRIORITIZE STRUCTURAL</text>
    <text x="84" y="415">HONESTY AND CULTURAL RELEVANCE.</text>
  </g>

  <text x="1520" y="450" text-anchor="end" fill="#202020" class="serif-editorial" font-size="172" font-weight="300" letter-spacing="-4">SPACES</text>

  <!-- Line 3: THAT ENDURE -->
  <g class="serif-editorial" font-size="172" letter-spacing="-4">
    <text x="210" y="690" fill="#202020" font-weight="300">THAT</text>
    <text x="730" y="690" fill="#A89A86" font-style="italic" font-weight="300">ENDURE</text>
  </g>

  <!-- Schema Inspector Badge Bottom Left -->
  <rect x="16" y="944" width="158" height="28" fill="#202020" rx="2"/>
  <text x="28" y="962" fill="#F7F7F4" class="mono-code" font-size="9" letter-spacing="1">&lt;/&gt; SCHEMA INSPECTOR</text>
</svg>