<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      .font-impact { font-family: 'Archivo Black', 'Impact', -apple-system, sans-serif; font-weight: 900; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>

    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>

    <clipPath id="centerCircle">
      <circle cx="800" cy="530" r="230"/>
    </clipPath>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#E2FF3B"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#0A0A0A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Dark Background & Subtle Grid -->
  <rect x="0" y="0" width="1600" height="1000" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#grid)"/>

  <!-- Top Navbar -->
  <g id="navbar">
    <!-- Brand Logo Left -->
    <g transform="translate(80, 48)">
      <text x="0" y="0" fill="#FFFFFF" class="font-impact" font-size="34" letter-spacing="-1">FORGE<tspan fill="#D4FF00">.</tspan></text>
      <!-- ATHLETIC badge box -->
      <rect x="156" y="-22" width="78" height="25" fill="#111111" stroke="#282828" stroke-width="1.2" rx="2"/>
      <text x="195" y="-6" text-anchor="middle" fill="#888888" class="font-sans" font-size="9" font-weight="800" letter-spacing="2">ATHLETIC</text>
    </g>

    <!-- Nav Bar Center Box -->
    <g transform="translate(500, 24)">
      <rect x="0" y="0" width="600" height="46" fill="#111111" stroke="#222222" stroke-width="1" rx="4"/>
      <g class="font-sans" font-size="11.5" font-weight="800" letter-spacing="1">
        <!-- HOME link with neon line -->
        <text x="45" y="27" fill="#D4FF00">HOME</text>
        <rect x="44" y="36" width="38" height="2.5" fill="#D4FF00" rx="1"/>

        <text x="115" y="27" fill="#888888">PROGRAMS</text>
        <text x="215" y="27" fill="#888888">COACHES</text>
        <text x="305" y="27" fill="#888888">TIMETABLE</text>
        <text x="405" y="27" fill="#888888">PRICING</text>
        <text x="485" y="27" fill="#888888">FACILITIES</text>
        <text x="580" y="27" fill="#888888" text-anchor="end">CONTACT</text>
      </g>
    </g>

    <!-- Join Now Button Right -->
    <g transform="translate(1380, 28)">
      <rect x="0" y="0" width="140" height="40" fill="#D4FF00" rx="4"/>
      <text x="70" y="25" text-anchor="middle" fill="#0A0A0A" class="font-sans" font-size="12" font-weight="900" letter-spacing="0.5">JOIN NOW  →</text>
    </g>
  </g>

  <!-- Background Big Outline Typography & Hero Focus -->
  <g id="hero-typography">
    <!-- Giant Solid Line 1: ITY — FORGE ATHLETIC -->
    <text x="800" y="380" text-anchor="middle" fill="#ECEBE6" class="font-impact" font-size="148" letter-spacing="-3">
      CITY — FORGE ATHLETIC
    </text>

    <!-- Giant Outlined Line 2: TIC EXCELLENCE — SEVI... -->
    <text x="800" y="600" text-anchor="middle" fill="none" stroke="#484848" stroke-width="2.5" class="font-impact" font-size="148" letter-spacing="-3">
      TIC EXCELLENCE — SEVEN
    </text>
  </g>

  <!-- Center Circle Cutout Visual (Athlete chalked hand & barbell on gym floor) -->
  <g clip-path="url(#centerCircle)">
    <!-- Textured gym mat floor -->
    <rect x="550" y="280" width="500" height="500" fill="#1C1C1C"/>
    <!-- Speckles and textures -->
    <circle cx="800" cy="530" r="230" fill="#181818"/>
    <!-- Chalk & floor angle line -->
    <line x1="600" y1="360" x2="1000" y2="700" stroke="#333333" stroke-width="12"/>
    <!-- Barbell steel shaft -->
    <line x1="620" y1="620" x2="980" y2="440" stroke="#666666" stroke-width="28" stroke-linecap="round"/>
    <line x1="620" y1="620" x2="980" y2="440" stroke="#999999" stroke-width="4" stroke-dasharray="14 6"/>
    <!-- Athlete wrist wrap & gripping hand -->
    <path d="M 740 590 C 720 540, 770 480, 830 470 C 870 460, 910 500, 880 550 C 850 600, 780 630, 740 590 Z" fill="#D2C8BC"/>
    <!-- Black wrist band wrap -->
    <rect x="745" y="520" width="95" height="42" transform="rotate(-25 790 540)" fill="#111111" stroke="#333" stroke-width="1"/>
    <rect x="765" y="534" width="20" height="12" transform="rotate(-25 790 540)" fill="#E5E5E5"/>
    <!-- Chalk dust effect overlay -->
    <circle cx="820" cy="490" r="35" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="780" cy="560" r="50" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <!-- Thin border circle for crisp separation -->
  <circle cx="800" cy="530" r="230" fill="none" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- Foreground vignette for contrast -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)" pointer-events="none"/>

  <!-- Bottom Left Headline & Facility Badge -->
  <g transform="translate(80, 760)">
    <!-- Pill tag: Red dot + ATHLETIC PERFORMANCE FACILITY -->
    <rect x="0" y="0" width="310" height="34" fill="#111111" stroke="#222222" stroke-width="1" rx="2"/>
    <circle cx="20" cy="17" r="4.5" fill="#E53935"/>
    <text x="36" y="21.5" fill="#D4FF00" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.2">ATHLETIC PERFORMANCE FACILITY</text>

    <!-- Large SEVEN LOCATIONS. text -->
    <text x="0" y="110" fill="#FFFFFF" class="font-impact" font-size="78" letter-spacing="-1">
      SEVEN LOCATIONS.
    </text>
  </g>
</svg>
